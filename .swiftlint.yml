included:
  - App
  - CLI
  - Filter
  - NetProbe
  - Packages/FaradayKit/Sources
  - Packages/FaradayKit/Tests
  - Shim

excluded:
  - build

disabled_rules:
  - optional_data_string_conversion

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

trailing_comma:
  mandatory_comma: true

large_tuple:
  warning: 3
  error: 4

identifier_name:
  min_length: 2
  excluded: [a, b, i, x, y, to, id, on, faraday_status, faraday_pathUpdateHandler]

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 100

nesting:
  type_level: 2
